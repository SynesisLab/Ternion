[package]
name = "ternion"
version = "0.1.0"
description = "One interface. Three models. The right model for every message."
license = "MIT"
repository = "https://github.com/SynesisLab/Ternion"
authors = ["SynesisLab"]
edition = "2024"

[lib]
name = "ternion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-log = "2.9"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.4"
tauri-plugin-global-shortcut = "2"

# In-app updates (§14 M4): artifacts signed with tauri signer; updates are
# pulled from the project's GitHub Releases (no Ternion-operated server).
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

reqwest = { version = "0.13", features = ["json", "stream"] }
url = "2"

rusqlite = { version = "0.40", features = ["bundled"] }

uuid = { version = "1", features = ["v7"] }
thiserror = "2"
log = "0.4"

# Bundled ripgrep engine for fs_search (§6.2) — ripgrep's library crates.
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"

# Recycle Bin deletes for fs_delete (§6.2: never permanent).
trash = "5"

# Unified diffs for the approval modal (§6.6).
similar = "2"

# API keys for endpoint profiles (§5.1/§10.1) — Windows Credential Manager;
# the DB row stores only the handle, never the secret.
keyring = { version = "3", features = ["windows-native"] }

# Image attachment pipeline (§7.2): decode png/jpg/webp/gif/bmp, re-encode
# JPEG. No metadata codecs — EXIF/GPS cannot survive the re-encode.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

# Region capture (§7.1): GDI BitBlt of the selected rect — deterministic,
# no WinRT surface area. A Windows.Graphics.Capture upgrade can slot in
# behind the same function signature later.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
